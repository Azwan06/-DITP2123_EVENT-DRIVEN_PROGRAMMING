
<h2 class="sr-only">Entity Relationship Diagram for QuickServe Vending Machine System</h2>
<div style="font-size:10px;font-family:monospace;letter-spacing:.1em;color:var(--color-text-secondary);margin-bottom:12px;text-transform:uppercase">Entity Relationship Diagram</div>
<div id="erd"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"Anthropic Sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"Anthropic Sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
  },
});
const { svg } = await mermaid.render('erd-svg', `erDiagram
  CATEGORIES ||--o{ PRODUCTS : "has many"
  CUSTOMERS ||--o{ TRANSACTIONS : "makes"
  TRANSACTIONS ||--o{ TRANSACTION_DETAILS : "contains"
  PRODUCTS ||--o{ TRANSACTION_DETAILS : "included in"
  PRODUCTS ||--o{ INVENTORY : "tracked by"

  CATEGORIES {
    int CategoryID PK
    varchar CategoryName
  }
  PRODUCTS {
    int ProductID PK
    int CategoryID FK
    varchar ProductName
    decimal Price
    int StockQuantity
    varchar ProductImage
  }
  CUSTOMERS {
    int CustomerID PK
    varchar CustomerName
    varchar PhoneNumber
  }
  TRANSACTIONS {
    int TransactionID PK
    int CustomerID FK
    decimal TotalAmount
    varchar PaymentMethod
    datetime TransactionDate
  }
  TRANSACTION_DETAILS {
    int DetailID PK
    int TransactionID FK
    int ProductID FK
    int Quantity
    decimal Subtotal
  }
  INVENTORY {
    int InventoryID PK
    int ProductID FK
    int StockIn
    int StockOut
    datetime LastUpdated
  }
`);
document.getElementById('erd').innerHTML = svg;

document.querySelectorAll('#erd svg.erDiagram .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});

document.querySelectorAll('#erd svg.erDiagram .row-rect-odd path, #erd svg.erDiagram .row-rect-even path').forEach(p => {
  p.setAttribute('stroke', 'none');
});
</script>
